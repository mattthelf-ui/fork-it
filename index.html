<style>html,body{margin:0;height:100%;background:#140b26;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
'use strict';
// ================= FORK IT — core =================
const cv=document.getElementById('c');let ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,U=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const FONT=s=>`900 ${Math.round(s)}px "Arial Black","Arial Rounded MT Bold","Helvetica Neue",Impact,Arial,sans-serif`;
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

// ================= world constants =================
const WW=1400,WH=1100,WALL=30,TR_LEN=350,DOOR=48;
const BAYS=[450,650,850,1050];
const RACKS=[{y:470,l:'A',c:'#ff4b3a',d:'#a8231a'},{y:680,l:'B',c:'#3a8dff',d:'#1b4fa8'},{y:890,l:'C',c:'#3fd15a',d:'#1d8030'}];
const RACK_X0=250,RACK_BAYS=10,BAY_W=100,RACK_D=50;
const LEVEL_REST=[0,.45,.8],BAND=[[0,.3],[.45,.66],[.8,1]],LEVEL_NAME=['FLOOR','MID','HIGH'];
const STAGE_Y=250,STAGE_X=[650,750,850,550,950,450];
const CHG={x:1290,y:110,w:90,h:90};
const SHIFT_LEN=180;
const ITEM={box:{v:10,name:'BOX'},fragile:{v:30,name:'FRAGILE'},tag:{v:22,name:'TAGGED'},gold:{v:60,name:'HIGH VALUE'}};
const TRUCK_COLS=[['#ff4f5e','#a3172b'],['#3f8cff','#1a3f9e'],['#f4f1ea','#9a968c'],['#39c46a','#1a6e36'],['#ffb52e','#b0640a'],['#a65cff','#5a239e']];
const STATIC_COLS=[];
(function(){const S=STATIC_COLS;
 S.push({x0:-WALL,x1:0,y0:-WALL,y1:WH+WALL,k:'wall'},{x0:WW,x1:WW+WALL,y0:-WALL,y1:WH+WALL,k:'wall'},{x0:-WALL,x1:WW+WALL,y0:WH,y1:WH+WALL,k:'wall'});
 let x=-WALL;for(const bx of BAYS){S.push({x0:x,x1:bx-DOOR,y0:-WALL,y1:0,k:'wall'});x=bx+DOOR;}S.push({x0:x,x1:WW+WALL,y0:-WALL,y1:0,k:'wall'});
 for(const r of RACKS)S.push({x0:RACK_X0,x1:RACK_X0+RACK_BAYS*BAY_W,y0:r.y,y1:r.y+RACK_D,k:'rack'});
})();

// ================= save / stats =================
const SAVE_KEY='forkit_save_v1';
const STATS=[
 {k:'speed',n:'TOP SPEED',d:'Drive faster'},
 {k:'accel',n:'ACCELERATION',d:'Get up to speed quicker'},
 {k:'turn',n:'TURNING',d:'Tighter, quicker steering'},
 {k:'lift',n:'LIFT SPEED',d:'Raise & lower forks faster'},
 {k:'stab',n:'LOAD STABILITY',d:'Loads slip less'},
 {k:'batt',n:'BATTERY',d:'Bigger battery, drains slower'}];
const MAXLV=5;
// ---- cartoon style helpers ----
const OL='#1a1028'; // the one outline colour used everywhere
const NOUP={speed:0,accel:0,turn:0,lift:0,stab:0,batt:0};
function upSig(u){return ''+u.speed+u.accel+u.turn+u.lift+u.stab+u.batt;}
function upTotal(u){let t=0;for(const k in NOUP)t+=u[k]|0;return t;}
// body paint tier from total upgrade levels: classic yellow -> orange -> cherry red -> electric blue -> gold (maxed)
const PAINTS=[['#fff27a','#ffc21e','#e08a00'],['#ffc98a','#ff8a1e','#d45a00'],['#ffa0a0','#ff4a4a','#b81e2a'],['#a8f0ff','#2bb6ff','#1468c8'],['#fffbd0','#ffd23a','#c9961a']];
function paintFor(u){const t=upTotal(u);return PAINTS[t>=30?4:t>=21?3:t>=13?2:t>=6?1:0];}
// damped squash & stretch curve: +0.2 at e=0 (squashed), overshoots, settles by ~0.8s
// PERFECT SHIFT boost: +1 level to one stat for the next 2 shifts (save.boost={k,left})
function boostOn(){return save.boost&&save.boost.left>0&&STATS.some(s=>s.k===save.boost.k)?save.boost:null;}
function effStats(){const s=Object.assign({},save.stats),b=boostOn();if(b)s[b.k]=Math.min(MAXLV+1,s[b.k]+1);return s;}
function boostLabel(){const b=boostOn();return b?'+1 '+STATS.find(s=>s.k===b.k).n+' • '+b.left+' SHIFT'+(b.left>1?'S':''):'';}
function squash(e){return .2*Math.exp(-e*6)*Math.cos(e*24);}
function upCost(lv){return Math.round(80*Math.pow(1.7,lv)/5)*5;}
function statVal(k,lv){switch(k){case'speed':return 150*(1+.12*lv);case'accel':return 1800*(1+.16*lv);case'turn':return 3.0*(1+.1*lv);case'lift':return .65*(1+.18*lv);case'stab':return 1/(1+.16*lv);case'batt':return 1+.25*lv;}return 1;}
function statPct(k,lv){return k==='stab'?Math.round(100/statVal(k,lv)):Math.round(100*statVal(k,lv)/statVal(k,0));}
function statFx(k,lv){const v=statVal(k,lv);switch(k){case'speed':return (v/10).toFixed(1)+' km/h';case'accel':return 'top speed in '+(statVal('speed',0)/v).toFixed(2)+'s';case'turn':return Math.round(v*57.3)+'°/sec';case'lift':return 'full lift: '+(1/v).toFixed(1)+'s';case'stab':return 'slip rate: '+Math.round(v*100)+'%';case'batt':return '~'+(v*2).toFixed(1)+' min full-speed';}return'';}
function defSave(){return{cash:0,shift:1,best:0,stats:{speed:0,accel:0,turn:0,lift:0,stab:0,batt:0},mute:false,easy:false,seenHelp:false,shifts:0,gfx:'auto',q:2,fps:false,cam:'std',steerV:2};}
let save=defSave();
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object'){const d=defSave();save=Object.assign(d,s);save.stats=Object.assign(d.stats,s.stats||{});if(s.steerV!==2){save.easy=false;save.steerV=2;}}}catch(e){}} // forklift-relative steering becomes the default once for old saves
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
loadSave();

// ================= audio (synth, no assets) =================
let AC=null,master=null,motor=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=save.mute?0:.45;master.connect(AC.destination);
 const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=48;f.type='lowpass';f.frequency.value=380;g.gain.value=0;o.connect(f);f.connect(g);g.connect(master);o.start();motor={o,g,f};}catch(e){AC=null;}}
function setMute(m){save.mute=m;writeSave();if(master)master.gain.value=m?0:.45;}
function tone(f,d,type='square',v=.12,slide=0,delay=0){if(!AC)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
let noiseBuf=null;
function noise(d,v=.25,fq=900){if(!AC)return;try{if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);}catch(e){}}
const SFX={
 clunk(){tone(140,.12,'square',.14,-60);noise(.06,.12,500);},
 ding(){tone(988,.12,'square',.08);tone(1319,.25,'square',.08,0,.08);},
 cash(){tone(1046,.08,'square',.07);tone(1318,.08,'square',.07,0,.07);tone(1568,.22,'square',.07,0,.14);},
 crash(){noise(.35,.45,1400);tone(90,.25,'sawtooth',.18,-40);},
 strike(){tone(1800,.15,'triangle',.12,-900);noise(.15,.25,3000);},
 beep(){tone(1050,.18,'square',.05);},
 horn(){tone(220,.35,'sawtooth',.08);tone(277,.35,'sawtooth',.06);},
 tick(){tone(1500,.05,'square',.05);},
 bad(){tone(300,.15,'square',.09);tone(200,.25,'square',.09,0,.12);},
 click(){tone(700,.05,'square',.06);},
 creak(){tone(150,.24,'sawtooth',.05,-45);tone(205,.18,'triangle',.045,70,.07);noise(.14,.07,700);},
 go(){tone(523,.12,'square',.08);tone(659,.12,'square',.08,0,.1);tone(784,.3,'square',.08,0,.2);},
 whistle(){tone(2200,.4,'sine',.06,300);},
 buy(){tone(660,.08,'square',.07);tone(880,.08,'square',.07,0,.07);tone(1320,.2,'triangle',.08,0,.14);},
};
// ================= FORK IT — perf: quality levels + sprite caches =================
const QUAL=[{n:'LOW',dpr:1,parts:40,fx:false},{n:'MED',dpr:1.25,parts:90,fx:true},{n:'HIGH',dpr:1.5,parts:160,fx:true}];
let QL=2;            // current quality level index
let WS=1;            // world raster scale (DPR*zoom), set each world frame
const PERF={fps:0,ms:0,acc:0,n:0,tw:0,slowS:0,playT:0,drops:0};
function mkC(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
const SC=new Map();  // generic sprite cache (cleared on resize / quality change)
function cached(key,build){let c=SC.get(key);if(!c){if(SC.size>300)SC.clear();c=build();SC.set(key,c);}return c;}
const TXC=new Map();
function clearCaches(){SC.clear();TXC.clear();}
const tctx=mkC(1,1).getContext('2d');
// text -> sprite (fill + stroke + drop shadow baked once)
function textSprite(s,size,col,sw,shadow,sc,scale){const fs=Math.max(1,Math.round(size));
 const key=s+'\u0001'+fs+'\u0001'+col+'\u0001'+Math.round(sw*2)+'\u0001'+(shadow?1:0)+'\u0001'+sc+'\u0001'+Math.round(scale*100);
 let e=TXC.get(key);if(e)return e;if(TXC.size>600)TXC.clear();
 tctx.font=FONT(fs);const w=tctx.measureText(s).width,pad=Math.ceil(sw/2+fs*.14+2),h=Math.ceil(fs*1.3);
 const c=mkC((w+pad*2)*scale,(h+pad*2)*scale),g=c.getContext('2d');g.scale(scale,scale);
 g.font=FONT(fs);g.textAlign='left';g.textBaseline='middle';g.lineJoin='round';const x=pad,y=pad+h/2;
 // cartoon text: hard (unblurred) offset shadow in the outline colour, then outline, then flat fill
 if(shadow){const o=Math.max(1.5,fs*.09);g.fillStyle='rgba(26,16,40,.85)';if(sw>0){g.lineWidth=sw;g.strokeStyle='rgba(26,16,40,.85)';g.strokeText(s,x+o*.4,y+o);}g.fillText(s,x+o*.4,y+o);}
 if(sw>0){g.lineWidth=sw;g.strokeStyle=sc;g.strokeText(s,x,y);}g.fillStyle=col;g.fillText(s,x,y);
 e={c,w,pad,h,dw:c.width/scale,dh:c.height/scale};TXC.set(key,e);return e;}
// draw text sprite; k = extra scale about the anchor
function tdraw(g,s,x,y,size,col,align,sw,shadow,sc,scale,k=1){const e=textSprite(String(s),size,col,sw,shadow,sc,scale);
 const ox=align==='left'?0:align==='right'?-e.w:-e.w/2;
 if(k===1)g.drawImage(e.c,x+ox-e.pad,y-e.h/2-e.pad,e.dw,e.dh);
 else g.drawImage(e.c,x+(ox-e.pad)*k,y+(-e.h/2-e.pad)*k,e.dw*k,e.dh*k);return e;}
// ================= FORK IT — game logic =================
let G=null,screen='title',T=0;
let boxId=1;
const FLOORISH={trailer:1,staged:1,floor:1};

function stageCount(n){return Math.min(6,(n===1?5:4)+Math.floor((n-1)/2));} // shift 1 gets a 5th staging spot
function rollItem(n){const pv=Math.min(.62,.18+.1*(n-1));if(Math.random()>pv)return{type:'box'};
 const o=['fragile'];if(n>=2)o.push('tag','tag');if(n>=3)o.push('gold');const t=pick(o);
 if(t==='tag')return{type:'tag',tag:pick(['A','B','C'])};if(t==='gold')return{type:'gold',tag:'C'};return{type:'fragile'};}
// Pacing: truck timer = (40 + 20 x loads) x tightening factor; gap = max(34, 42 - 1.5(n-1)) s,
// ~3 loads per truck through shift 8 (lo = 3 + floor((n-1)/8)); timers x1.2 on shift 1 tightening 6%/shift (min x0.75).
function shiftPace(n){return{gap:Math.max(34,42-1.5*(n-1)),tf:n>=5?Math.max(.75,1-.04*(n-5)):1.2-.06*(n-1),lo:Math.min(6,3+Math.floor((n-1)/8))};}
// loads per truck: 2-3 on the first two shifts (learning), then lo with a 25% chance of one extra
function truckLoads(n,P){return n===1?2:n===2?(Math.random()<.5?2:3):P.lo+(Math.random()<.25?1:0);}
function genSchedule(n){const P=shiftPace(n),out=[];let t=1;
 for(let i=0;i<12;i++){if(i===1)t+=n===1?rnd(35,40):P.gap*rnd(.92,1.08);else if(i>1)t+=P.gap*rnd(.9,1.1);if(t>SHIFT_LEN-40)break;
  // late arrivals: shrink the load so the truck can still be emptied before the shift ends
  const rem=SHIFT_LEN-t-3.4;let nb=Math.min(truckLoads(n,P),Math.floor((rem-20)/14));if(nb<2)break;
  const items=[];for(let k=0;k<nb;k++)items.push(rollItem(n));
  out.push({t,items,timer:Math.round(Math.min((40+20*nb)*P.tf,rem))});}
 return out;}
let pendingSched=null;
function shiftInfo(n){if(!pendingSched||pendingSched.n!==n)pendingSched={n,s:genSchedule(n)};return{trucks:pendingSched.s.length,spots:stageCount(n),loads:pendingSched.s.reduce((a,q)=>a+q.items.length,0)};}
function newBox(it,n){return{id:boxId++,type:it.type,tag:it.tag||null,value:Math.round(ITEM[it.type].v*(1+.1*(n-1))),x:0,y:0,state:'trailer',spot:null,lv:0,ttl:0,truck:null};}
function makePeople(n){const P=[];const mk=(type,path,col,spd)=>({type,path,i:1,x:path[0][0],y:path[0][1],spd,col,wait:rnd(0,2),stun:0,inv:0,bub:null,dir:0,walk:0});
 P.push(mk('worker',[[110,90],[110,1050]],'#ff7a1a',42));
 P.push(mk('worker',[[280,600],[1220,600]],'#c6ff2a',38));
 if(n>=2)P.push(mk('worker',[[1320,1035],[300,1035],[1320,1035],[1320,300]],'#ff3fae',45));
 if(n>=4)P.push(mk('worker',[[280,810],[1220,810]],'#2ef0ff',40));
 P.push(mk('boss',[[300,370],[1320,370],[1320,810],[160,810],[160,370]],'#ffffff',34));
 return P;}

function startShift(){const n=save.shift;btns=[];const _S=effStats(),_bk=boostOn()?save.boost.k:null;const sched=pendingSched&&pendingSched.n===n?pendingSched.s:genSchedule(n);pendingSched=null;
 G={shift:n,t:0,dur:SHIFT_LEN,cd:3.4,endT:0,endReason:null,paused:false,
  fl:{x:750,y:340,a:-Math.PI/2,v:0,w:0,steer:0,wheel:0,h:0,autoLow:false,carry:null,under:null,slip:0,batt:100,rack:null,accel:0,crashCD:0,strikeCD:0,warnH:0,charging:false,easyRev:false,beepT:0,lastLift:0},
  trucks:[],sched,spawned:0,queue:[],boxes:[],people:makePeople(n),parts:[],pops:[],shake:0,safety:100,safeT:0,
  spots:STAGE_X.slice(0,stageCount(n)).map(x=>({x,y:STAGE_Y,box:null})),
  racks:RACKS.map(r=>({slots:Array.from({length:RACK_BAYS},()=>[null,null,null])})),
  st:{put:0,bonus:0,speed:0,damage:0,fines:0,done:0,missed:0,total:0,racked:0,drops:0,crashes:0,bumps:0,strikes:0,clutter:0,clutterFines:0},
  earn:0,banner:null,hint:'',hintCol:'#fff',warn:'',bossCD:2,msgCD:{},camX:750,camY:250,tickT:0};G.S=_S;G.boostK=_bk;
 G.st.total=G.sched.length;
 screen='play';
}

// ---------- helpers ----------
function truckAt(i){return G.trucks.find(t=>t.bay===i);}
function bodyCircles(f){const c=Math.cos(f.a),s=Math.sin(f.a);return[[f.x+c*12,f.y+s*12],[f.x-c*14,f.y-s*14]];}
function forkPts(f){const c=Math.cos(f.a),s=Math.sin(f.a);return{lx:f.x+c*50,ly:f.y+s*50,tx:f.x+c*68,ty:f.y+s*68,c,s};}
function inTrailer(b,t){return Math.abs(b.x-t.bx)<50&&b.y<0&&b.y>-WALL-TR_LEN-5;}
function colliders(near){const L=[];const nx=near?near.x:0,ny=near?near.y:0,R=near?160:1e9;
 const ok=r=>!near||(nx>r.x0-R&&nx<r.x1+R&&ny>r.y0-R&&ny<r.y1+R);
 for(const r of STATIC_COLS)if(ok(r))L.push(r);
 for(let i=0;i<4;i++){const bx=BAYS[i],t=truckAt(i);const open=t&&t.door>.85;
  if(!open)L.push({x0:bx-DOOR,x1:bx+DOOR,y0:-WALL,y1:0,k:'door'});
  if(t){const y0=-WALL-TR_LEN;L.push({x0:bx-64,x1:bx-DOOR,y0:y0-14,y1:-WALL,k:'truck'},{x0:bx+DOOR,x1:bx+64,y0:y0-14,y1:-WALL,k:'truck'},{x0:bx-64,x1:bx+64,y0:y0-14,y1:y0,k:'truck'});}}
 const f=G.fl,pk=!f.carry&&f.h<=.1?forkPts(f):null;
 for(const b of G.boxes)if(FLOORISH[b.state]){const r={x0:b.x-15,x1:b.x+15,y0:b.y-15,y1:b.y+15,k:(b===f.under||(pk&&dist(b.x,b.y,pk.lx,pk.ly)<24))?'pocket':'box',b};if(ok(r))L.push(r);}
 return L;}
function rackAt(px,py){for(let i=0;i<3;i++){const r=RACKS[i];if(px>=RACK_X0&&px<=RACK_X0+RACK_BAYS*BAY_W&&py>=r.y&&py<=r.y+RACK_D)return i;}return-1;}
function bandOf(h){for(let i=0;i<3;i++)if(h>=BAND[i][0]-.001&&h<=BAND[i][1]+.001)return i;return-1;}
function pop(x,y,text,col='#fff',size=18,life=1.3){G.pops.push({x,y,text,col,size,t:0,life});if(G.pops.length>40)G.pops.shift();}
function msgOnce(key,x,y,text,col,cd=1.2){if((G.msgCD[key]||0)>G.t)return;G.msgCD[key]=G.t+cd;pop(x,y,text,col,17);}
function banner(text,col='#ffe14d',sub=''){G.banner={text,col,sub,t:0};}
function sparks(x,y,n,cols=['#fff6a0','#ffd23a','#ff8a1a']){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(80,320);G.parts.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.6),t:0,col:pick(cols),sz:rnd(1.5,3)});}}
function puff(x,y,n,col='rgba(230,220,200,'){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(10,60);G.parts.push({k:'puff',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.9),t:0,col,sz:rnd(5,12)});}}

const ctl={stick:{id:null,bx:0,by:0,dx:0,dy:0,r:56},lift:{id:null,val:0,rect:null},pauseRect:null,camRect:null,gauge:null};
const DZPX=11; // dead zone in CSS px for stick and levers
function stickCurve(v,dz){return Math.sign(v)*clamp((Math.abs(v)-dz)/(.8-dz),0,1);}
function leverDZ(v,dz){return Math.abs(v)<dz?0:Math.sign(v)*Math.min(1,(Math.abs(v)-dz)/(.6-dz));} // full rate at 60% lever travel
// softer steering at small stick input: 50% linear + 50% squared (full lock unchanged)
function steerCurve(s){const a=Math.abs(s);return Math.sign(s)*(.5*a+.5*a*a);}
function leverTravel(){return ctl.lift.rect?ctl.lift.rect.h/2-24*U:56;}
function readInput(){if(testInput)return Object.assign({thr:0,st:0,lift:0},testInput);
 let thr=0,st=0,lift=0;const f=G.fl;
 if(ctl.stick.id!==null){let dx=ctl.stick.dx/ctl.stick.r,dy=ctl.stick.dy/ctl.stick.r;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
  const sdz=DZPX/ctl.stick.r;if(m>sdz){if(save.easy){const want=Math.atan2(dy,dx),mg=clamp((Math.min(m,1)-sdz)/(.8-sdz),0,1);
    let d=angDiff(want,f.a);if(f.easyRev){if(Math.abs(d)<Math.PI*.42)f.easyRev=false;}else if(Math.abs(d)>Math.PI*.64&&Math.abs(f.v)<60)f.easyRev=true;
    if(!f.easyRev){thr=mg*Math.max(.25,Math.cos(Math.min(Math.abs(d),1.4)));st=clamp(d*1.8,-1,1);}else{const dr=angDiff(want,f.a+Math.PI);thr=-mg*Math.max(.3,Math.cos(Math.min(Math.abs(dr),1.4)));st=-clamp(dr*1.8,-1,1);}}
   else{thr=stickCurve(-dy,sdz);st=steerCurve(stickCurve(dx,sdz));}}}
 if(keys.ArrowUp)thr=1;if(keys.ArrowDown)thr=-1;if(keys.ArrowLeft)st=-1;if(keys.ArrowRight)st=1;
 if(keys.KeyW)lift=1;if(keys.KeyS)lift=-1;
  const ldz=DZPX/leverTravel();if(ctl.lift.id!==null)lift=leverDZ(ctl.lift.val,ldz);
 return{thr,st,lift};}

function update(dt){T+=dt;
 if(screen!=='play'||!G)return;
 if(G.paused)return;
 updateFx(dt);
 if(G.cd>0){G.cd-=dt;const s=Math.ceil(G.cd);if(s!==G.lastCd){G.lastCd=s;if(s>0)SFX.tick();else SFX.go();}return;}
 if(G.endT>0){G.endT-=dt;G.fl.v*=.9;if(motor)motor.g.gain.value=0;if(G.endT<=0)finishShift();return;}
 G.t+=dt;
 const inp=readInput();
 updateTrucks(dt);
 updateFL(dt,inp);
 interact(dt,inp);
 updatePeople(dt);
 updateRacks(dt);
 updateClutter(dt);
 updateSafety(dt,inp);
 if(G.safety<=0)endShift('fired');else if(G.t>=G.dur)endShift('time');
}
function compact(a){let j=0;for(let i=0;i<a.length;i++){const p=a[i];if(p.t<p.life)a[j++]=p;}a.length=j;}
function updateFx(dt){
 for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const fr=p.k==='spark'?4:p.k==='puff'?2:3;p.vx*=1-fr*dt;p.vy*=1-fr*dt;if(p.r!==undefined)p.r+=p.vr*dt;}
 compact(G.parts);const cap=QUAL[QL].parts;if(G.parts.length>cap)G.parts.splice(0,G.parts.length-cap);
 for(const p of G.pops)p.t+=dt;compact(G.pops);
 G.gcT=(G.gcT||0)+dt;if(G.gcT>2){G.gcT=0;G.boxes=G.boxes.filter(b=>b.state!=='gone');}
 G.shake=Math.max(0,G.shake-dt*30);
 if(G.banner){G.banner.t+=dt;if(G.banner.t>2.6)G.banner=null;}
}
function updateTrucks(dt){
 while(G.sched.length&&G.sched[0].t<=G.t)G.queue.push(G.sched.shift());
 if(G.queue.length){const free=[0,1,2,3].filter(i=>!truckAt(i));if(free.length){const mid=free.filter(i=>i===1||i===2);const q=G.queue.shift(),bay=pick(G.spawned===0&&mid.length?mid:free),col=pick(TRUCK_COLS);G.spawned++;
   G.trucks.push({bay,bx:BAYS[bay],state:'arriving',anim:0,door:0,timer:q.timer,timerMax:q.timer,items:q.items,col,result:null,boxesN:q.items.length,beepT:0,offY:-600,lastTick:99});}}
 const f=G.fl;
 for(const t of G.trucks){
  if(t.state==='arriving'){t.anim=Math.min(1,t.anim+dt/3.2);const e=1-Math.pow(1-t.anim,3);t.offY=-600*(1-e);t.beepT-=dt;if(t.beepT<=0&&t.anim<.95){t.beepT=.5;if(dist(f.x,f.y,t.bx,0)<700)SFX.beep();}
   if(t.anim>=1){t.state='docked';t.offY=0;G.st.loadsIn=(G.st.loadsIn||0)+t.items.length;t.items.forEach((it,i)=>{const b=newBox(it,G.shift);b.x=t.bx;b.y=-62-i*38;b.truck=t;G.boxes.push(b);});banner('BAY '+(t.bay+1)+' — TRUCK READY!','#5dff7a',t.boxesN+' loads • '+t.timer+'s');SFX.horn();}}
  else if(t.state==='docked'){t.door=Math.min(1,t.door+dt*1.6);t.timer-=dt;
   const left=G.boxes.filter(b=>FLOORISH[b.state]&&inTrailer(b,t)).length;t.left=left;
   if(t.timer<10&&t.timer>0){const s=Math.ceil(t.timer);if(s!==t.lastTick){t.lastTick=s;SFX.tick();}}
   if(left===0&&t.door>=1){t.result='done';const bonus=15+4*t.boxesN,sp=Math.round(Math.max(0,t.timer)*.5);G.st.bonus+=bonus;G.st.speed+=sp;G.earn+=bonus+sp;G.st.done++;
    pop(t.bx,40,'TRUCK EMPTY! +$'+(bonus+sp),'#5dff7a',24,2);confetti(t.bx,20,40);SFX.cash();t.state='leaving';t.anim=1;}
   else if(t.timer<=0){t.result='missed';t.state='leaving';t.anim=1;}}
  else if(t.state==='leaving'){
   const clear=!flInBay(t);
   if(!clear){if(t.result==='missed')msgOnce('out'+t.bay,t.bx,60,'GET OUT! TRUCK LEAVING','#ff5050',1.5);continue;}
   if(!t.finalized){t.finalized=true;const lost=G.boxes.filter(b=>FLOORISH[b.state]&&inTrailer(b,t));
    // late fine: $10 for a missed truck, up to $15 if most of its load was left behind
    const fine=t.result==='missed'?Math.min(15,10+Math.round(Math.max(0,lost.length-1)*2.5)):0;lost.forEach(b=>b.state='gone');
    if(fine){G.st.fines+=fine;G.earn-=fine;}
    if(t.result==='missed'){G.st.missed++;pop(t.bx,40,'TRUCK LEFT! -$'+fine,'#ff5050',22,2);SFX.bad();}}
   t.door=Math.max(0,t.door-dt*2);
   if(t.door<=0){t.anim=Math.max(0,t.anim-dt/2.4);const e=t.anim*t.anim;t.offY=-600*(1-e);if(t.anim<=0)t.gone=true;}}
 }

}
function flInBay(t){const f=G.fl,P=forkPts(f);const pts=[...bodyCircles(f),[P.tx,P.ty]];for(const p of pts)if(p[1]<12&&Math.abs(p[0]-t.bx)<70)return true;return false;}

function updateFL(dt,inp){const f=G.fl,S=G.S||save.stats;
 let maxV=statVal('speed',S.speed);const acc=statVal('accel',S.accel),tr=statVal('turn',S.turn);
 const battMul=f.batt<=0?.35:f.batt<20?.6+.4*f.batt/20:1;maxV*=battMul;if(f.carry)maxV*=.92;f.maxV=maxV;
 const target=inp.thr>=0?inp.thr*maxV:inp.thr*maxV*.6;
 let rate=acc;if(f.v*target<0)rate=acc*2.2;else if(Math.abs(target)<Math.abs(f.v))rate=acc*1.6;
 const pv=f.v;f.v=approach(f.v,target,rate*dt);f.accel=(f.v-pv)/dt;f.brakeDv=pv*target<0?Math.max(0,Math.abs(pv)-Math.abs(f.v))*1.3:0; // only reverse-stick braking shoves the load; letting go is free
 f.steer+=(inp.st-f.steer)*(1-Math.exp(-dt/.025)); // very short steering ease (~75ms to 95%); throttle stays instant
 const sp=Math.abs(f.v);
 // 3-wheel truck: ONE rear steering wheel (up to ~90 deg) -> yaw about the front-axle midpoint, even at zero speed.
 // Stick left/right = yaw rate (spins in place with no throttle, arcs tightly with it). Reversing steers car-style;
 // the flip blends in over thr -0.05..-0.30 so there is no snap.
 const dir=inp.thr<-.05?Math.max(-1,1-2*(-inp.thr-.05)/.25):1;
 // in-place spin: capped at ~115 deg/s (scales with the turn upgrade) with a steeper curve near full stick for aiming;
 // blends into the normal turn rate as speed picks up (fully normal by 40 u/s)
 const lowF=1-Math.min(1,sp/40),as=Math.abs(f.steer),sShape=Math.sign(f.steer)*(.35*as+.65*as*as*as);
 const w=((1-lowF)*f.steer*tr+lowF*sShape*tr*(2.0/3.0))*dir*(1-.3*Math.min(1,sp/220));
 const pa=f.a,ox=f.x,oy=f.y;
 const ca=Math.cos(f.a),sa=Math.sin(f.a),px=f.x+ca*16,py=f.y+sa*16;
 f.a+=w*dt;f.w=w;const c2=Math.cos(f.a),s2=Math.sin(f.a);
 f.x=px-c2*16+c2*f.v*dt;f.y=py-s2*16+s2*f.v*dt;
 // don't rotate into walls / trailer sides / racks: if the swing itself digs in, drop the rotation for this step
 if(Math.abs(w)>.05){const cols=colliders(f),pn=contactPen(f,cols);if(pn>.25){const na=f.a,nx=f.x,ny=f.y;f.a=pa;f.x=ox+ca*f.v*dt;f.y=oy+sa*f.v*dt;
   if(contactPen(f,cols)<pn-.1)f.w=0;else{f.a=na;f.x=nx;f.y=ny;}}
  // inside a trailer / dock door: never swing more than ~32 deg off the trailer axis, so the truck can't wedge across it
  if(f.w!==0&&inTrailerZone(f)){const dev=a=>{const d1=angDiff(a,-Math.PI/2),d2=angDiff(a,Math.PI/2);return Math.abs(d1)<Math.abs(d2)?d1:d2;};
   const d0=dev(pa),d1=dev(f.a);if(Math.abs(d1)>TR_CAP&&Math.abs(d1)>Math.abs(d0)){f.a=pa;f.x=ox+ca*f.v*dt;f.y=oy+sa*f.v*dt;f.w=0;}}}
 // driving in/out of a trailer touching (or within 1.5px of) a wall with the stick centred left/right: the trailer walls guide the truck straight (no grinding along a wall)
 if(sp>5&&Math.abs(inp.st)<.15&&inTrailerZone(f)&&contactPen(f,colliders(f).filter(r=>HARD[r.k]),2)>0){const d1=angDiff(f.a,-Math.PI/2),d2=angDiff(f.a,Math.PI/2),dv=Math.abs(d1)<Math.abs(d2)?d1:d2;
  if(Math.abs(dv)>.01){const st=Math.sign(dv)*Math.min(Math.abs(dv),1.4*dt);const cA=Math.cos(f.a),sA=Math.sin(f.a),qx=f.x+cA*16,qy=f.y+sA*16;f.a-=st;f.x=qx-Math.cos(f.a)*16;f.y=qy-Math.sin(f.a)*16;}}
 // rear wheel angle (visual): direction the rear contact point travels
 {const vr=-f.w*WB,vx=f.v;if(Math.abs(vr)+Math.abs(vx)>2){let d=Math.atan2(vr,vx);if(d>Math.PI/2)d-=Math.PI;else if(d<-Math.PI/2)d+=Math.PI;f.wheel=d;}}
 const spE=Math.max(sp,Math.abs(f.w)*WB*.6);
 const lr=statVal('lift',S.lift)*(f.batt<=0?.4:1)*(f.carry?.85:1);
 if(inp.lift)f.autoLow=false;
 // after a drop-off the forks glide back to pickup height on their own (any lift input cancels it)
 if(f.autoLow&&!f.carry){f.h=Math.max(0,f.h-lr*1.6*dt);if(f.h<=0)f.autoLow=false;}else f.h=clamp(f.h+inp.lift*lr*dt,0,1);
 f.batt=Math.max(0,f.batt-(spE/150*.8+Math.abs(inp.lift)*.35+.03)*dt/statVal('batt',S.batt));
 f.charging=false;
 if(sp<6&&f.x>CHG.x&&f.x<CHG.x+CHG.w&&f.y>CHG.y&&f.y<CHG.y+CHG.h){f.charging=true;f.batt=Math.min(100,f.batt+16*dt);}
 // reverse beeper
 if(f.v<-8){f.beepT-=dt;if(f.beepT<=0){f.beepT=.55;SFX.beep();}}else f.beepT=0;
 if(motor){motor.o.frequency.value=42+spE*.5+Math.abs(inp.lift)*30;motor.g.gain.value=save.mute?0:.015+Math.min(1,spE/150)*.035+Math.abs(inp.lift)*.02;}
 collide(f);
 f.crashCD-=dt;f.strikeCD-=dt;
}
const TR_CAP=32/57.3;
function inTrailerZone(f){const P=forkPts(f),px=f.x+P.c*16,py=f.y+P.s*16;for(const t of G.trucks){if(t.state!=='docked'&&t.state!=='leaving')continue;
  for(const q of [[px,py],[P.lx,P.ly]])if(q[1]<0&&Math.abs(q[0]-t.bx)<64)return true;}return false;}
const WB=42; // front axle (+16) to the single rear steering wheel (-26)
const HARD={wall:1,truck:1,door:1};
// collision probes: two body circles + the fork tines (tines only stop on walls, trailer sides and doors; they may enter racks)
function probes(f){const cs=bodyCircles(f),P=forkPts(f);return[[cs[0][0],cs[0][1],19,0],[cs[1][0],cs[1][1],19,0],[P.lx,P.ly,8,1],[P.tx,P.ty,3,1]];}
function contactPen(f,cols,mg=0){let m=0;for(const q of probes(f))for(const r of cols){if(r.k==='pocket'||(q[3]&&!HARD[r.k]))continue;const x=q[0],y=q[1],dx=x-clamp(x,r.x0,r.x1),dy=y-clamp(y,r.y0,r.y1);const R=q[2]+mg,p=(dx||dy)?R-Math.sqrt(dx*dx+dy*dy):R+Math.min(x-r.x0,r.x1-x,y-r.y0,r.y1-y);if(p>m)m=p;}return m;}
function collide(f){let maxImp=0,kind=null,hx=0,hy=0,touchP=null;const cols=colliders(f);
 for(let pass=0;pass<3;pass++){const pr=probes(f);
  for(let i=0;i<pr.length;i++){let cx=pr[i][0],cy=pr[i][1];const R=pr[i][2],tine=pr[i][3];
   for(const r of cols){if(tine&&!HARD[r.k])continue;const qx=clamp(cx,r.x0,r.x1),qy=clamp(cy,r.y0,r.y1);let dx=cx-qx,dy=cy-qy;const d2=dx*dx+dy*dy;if(d2>=R*R)continue;
    let nx,ny,pen;if(d2<1e-6){const l=cx-r.x0,rg=r.x1-cx,tp=cy-r.y0,bt=r.y1-cy,m=Math.min(l,rg,tp,bt);if(m===l){nx=-1;ny=0;pen=l+R;}else if(m===rg){nx=1;ny=0;pen=rg+R;}else if(m===tp){nx=0;ny=-1;pen=tp+R;}else{nx=0;ny=1;pen=bt+R;}}
    else{const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=R-d;}
    f.x+=nx*pen;f.y+=ny*pen;cx+=nx*pen;cy+=ny*pen;
    if(r.k==='pocket'){touchP=r.b;if(f.v>90&&f.ramB!==r.b){f.ramB=r.b;palletRam(r.b,f.v);}if(f.v>0)f.v*=.6;continue;} // pallet seated against the mast: soft stop; ramming it fast costs a little safety
    const imp=-(Math.cos(f.a)*f.v*nx+Math.sin(f.a)*f.v*ny);if(imp>maxImp){maxImp=imp;kind=r.k;hx=qx;hy=qy;}}}}
 if(!touchP)f.ramB=null; // one ram per contact with a seated pallet
 if(maxImp>0){const sp=Math.abs(f.v);f.v*=clamp(1-maxImp/Math.max(1,sp)*1.05,0,1);
  if(maxImp>48&&f.crashCD<=0){f.v=-Math.sign(f.v||1)*Math.min(40,maxImp*.25);crash(kind,maxImp,hx,hy);}}}
function palletRam(b,v){const f=G.fl;G.st.crashes++;G.st.rams=(G.st.rams||0)+1;hurtSafety(2);G.shake=Math.min(8,3+v/40);SFX.clunk();puff(b.x,b.y,6);
 pop(b.x,b.y-24,'EASY ON THE PALLET! -2 SAFETY','#ffb030',15,1.2);}
function crash(kind,imp,x,y){const f=G.fl;f.crashCD=.6;let pen=kind==='box'?2:imp>100?8:4;const boss=nearBoss(x,y);
 if(boss){pen*=2;boss.bub={text:'I SAW THAT!',t:2};}
 hurtSafety(pen);G.st.crashes++;G.shake=Math.min(14,4+imp/12);sparks(x,y,14+imp/8|0);SFX.crash();
 pop(x,y-10,(kind==='box'?'BUMP':'CRASH!')+' -'+pen+' SAFETY','#ff6040',18);
 if(f.carry)f.slip+=imp/160*(isFrag(f.carry)?1.5:1);}
function forkStrike(P){const f=G.fl;if(f.strikeCD<=0){f.strikeCD=.8;const boss=nearBoss(P.tx,P.ty);const pen=boss?10:5;if(boss)boss.bub={text:'WATCH THE RACK!',t:2};hurtSafety(pen);G.st.strikes++;G.shake=8;sparks(P.tx,P.ty,22);SFX.strike();pop(P.tx,P.ty-20,'FORK STRIKE! -'+pen,'#ff6040',18);if(f.carry)f.slip+=.3;}
 for(let i=0;i<14;i++){const p=forkPts(f);if(rackAt(p.tx,p.ty)<0)break;f.x-=p.c*4;f.y-=p.s*4;}f.v=-Math.min(30,Math.abs(f.v)+10);}

function interact(dt,inp){const f=G.fl,P=forkPts(f);G.hint='';G.hintCol='#fff';
 if(f.carry){const b=f.carry;
  const ri=rackAt(P.tx,P.ty);
  if(ri<0)f.rack=null;
  else if(!f.rack){const bay=Math.floor((P.lx-RACK_X0)/BAY_W),lv=bandOf(f.h);
   if(lv<0||bay<0||bay>=RACK_BAYS)forkStrike(P);
   else if(G.racks[ri].slots[bay][lv]){msgOnce('full',P.tx,P.ty-20,'SLOT FULL','#ffb030');for(let i=0;i<14;i++){const p=forkPts(f);if(rackAt(p.tx,p.ty)<0)break;f.x-=p.c*4;f.y-=p.s*4;}f.v=Math.min(f.v,0);}
   else f.rack={r:ri,bay,lv};}
  if(f.rack){f.rack.bay=clamp(Math.floor((P.lx-RACK_X0)/BAY_W),0,RACK_BAYS-1);const lo=LEVEL_REST[f.rack.lv],hi=BAND[f.rack.lv][1];f.h=clamp(f.h,lo,hi);
   const rk=RACKS[f.rack.r];
   if(b.tag&&b.tag!==rk.l){G.hint='WRONG RACK — THIS GOES TO RACK '+b.tag;G.hintCol='#ff6050';}
   else if(G.racks[f.rack.r].slots[f.rack.bay][f.rack.lv]){G.hint='SLOT FULL — BACK OUT';G.hintCol='#ffb030';}
   else{G.hint='LOWER FORKS TO SET IT DOWN';G.hintCol='#5dff7a';}
   if(f.h<=lo+.0001&&inp.lift<-.15)tryRackPlace(P);}
  else{
   if(f.h<=.03&&inp.lift<=0)trySetDown(P);
   if(f.carry){if(isFrag(b)&&!b.tag){G.hint='FRAGILE! DRIVE GENTLY — EASY ON TURNS & BRAKES';G.hintCol='#ff7ad0';}
    else if(b.tag)G.hint='TAKE TO RACK '+b.tag+(b.type==='gold'?' — HIGH VALUE!':'');
    else{const freeS=G.spots.some(s=>!s.box);G.hint=freeS?'STAGE IT (YELLOW SQUARES) OR RACK IT':'STAGING FULL — PUT IT AWAY IN A RACK';}

function setQuality(q){q=clamp(q,0,2);if(q===QL)return;QL=q;save.q=q;writeSave();resize();}

// ---------- main loop ----------
function render(){ctx.setTransform(1,0,0,1,0,0);
 if(screen==='play'&&G){renderWorld();drawHUD();}
 else if(screen==='title')drawTitle();else if(screen==='howto')drawHowto();else if(screen==='intro')drawIntro();else if(screen==='summary')drawSummary();else if(screen==='garage')drawGarage();}
let last=performance.now();
const API={manual:false,errors:[]};
// perf meter + adaptive quality: 3 slow half-second windows in a row (<~42fps) during play -> drop a level
function perfTick(ms){if(ms>250)return;const live=screen==='play'&&G&&!G.paused&&G.cd<=0;
 if(live){PERF.pAcc=(PERF.pAcc||0)+ms;PERF.pN=(PERF.pN||0)+1;if(PERF.pN>=60){PERF.playMs=PERF.pAcc/PERF.pN;PERF.playFps=1000/PERF.playMs;PERF.pAcc=PERF.pN=0;}}
 PERF.acc+=ms;PERF.n++;PERF.tw+=ms;if(PERF.tw<500)return;
 PERF.ms=PERF.acc/PERF.n;PERF.fps=1000/PERF.ms;PERF.acc=PERF.n=PERF.tw=0;if(save.gfx!=='auto'||!live){PERF.slowS=PERF.fastS=0;return;}
 if(PERF.ms>24){PERF.slowS++;PERF.fastS=0;}else if(PERF.ms<13){PERF.fastS=(PERF.fastS||0)+1;PERF.slowS=0;}else{PERF.slowS=0;PERF.fastS=0;}
 if(PERF.slowS>=3&&QL>0){PERF.slowS=0;PERF.dropped=true;setQuality(QL-1);}
 else if(PERF.fastS>=20&&QL<2&&!PERF.dropped){PERF.fastS=0;setQuality(QL+1);}}
// rAF loop: dt capped at 100ms, simulation in fixed <=1/60s sub-steps, one render per frame
function frame(now){requestAnimationFrame(frame);const ms=now-last;let dt=ms/1000;last=now;if(dt>.1)dt=.1;if(dt<=0)return;RDT=dt;perfTick(ms);
 if(!API.manual){const n=Math.max(1,Math.ceil(dt/(1/60)-.01)),sd=dt/n;for(let i=0;i<n;i++)update(sd);}
 try{render();}catch(e){API.errors.push(String(e&&e.stack||e));throw e;}}
QL=save.gfx==='auto'?clamp(save.q|0,0,2):clamp(save.gfx|0,0,2);PERF.show=!!save.fps;
resize();requestAnimationFrame(frame);
// test hooks (harmless for players)
Object.defineProperties(API,{G:{get(){return G;}},screen:{get(){return screen;},set(v){screen=v;}},save:{get(){return save;}},btns:{get(){return btns;}},QL:{get(){return QL;}},DPR:{get(){return DPR;}}});
Object.assign(API,{writeSave,loadSave,startShift,update,render,step(n,dt=1/60){for(let i=0;i<n;i++)update(dt);},setInput(o){testInput=o;},forkPts,PERF,setQuality,tapUI,ctl,readInput,RACKS,STAGE_X,LEVEL_REST});
window.__FORKIT=API;
